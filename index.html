<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestión de Tickets</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-logo">
                <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
                </svg>
            </div>
            
            <h1 class="text-2xl text-center mb-2">Bienvenido</h1>
            <p class="text-sm text-gray-500 text-center mb-6">Ingresa tus credenciales para continuar</p>
            
            <!-- Formulario de Login -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="tu@email.com"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="••••••••"
                        required
                    >
                </div>
                
                <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                    <input type="checkbox" id="remember" style="width: auto;">
                    <label for="remember" style="margin: 0; font-size: 0.875rem;">Recordar sesión</label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block mb-4">
                    Iniciar Sesión
                </button>
                
                <div class="text-center">
                    <a href="#" class="text-sm text-gray-600" style="text-decoration: none;">¿Olvidaste tu contraseña?</a>
                </div>
                
                <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid #e5e7eb;">
                
                <div class="text-center">
                    <p class="text-sm text-gray-600 mb-2">¿No tienes una cuenta?</p>
                    <a href="signup.html" class="btn btn-outline btn-block">
                        Crear Cuenta
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Simular login exitoso
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
